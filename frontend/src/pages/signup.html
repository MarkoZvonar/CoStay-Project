<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoStay</title>

    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div id="reg-box">
        <h2 class="naslov">Napravi CoStay račun</h2>
        <h1 class="opis">Unesi svoje podatke za registraciju.</h1>
        
        <form id="form">
    <div id="name">
        <label for="ime">Ime:</label>
        <input type="text" id="ime" name="ime" required>

        <label for="prezime">Prezime:</label>
        <input type="text" id="prezime" name="prezime" required>
    </div>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" minlength="6" required>

    <label for="birthday">Datum rođenja:</label>
    <input type="date" id="birthday" name="datum_rodenja">

    <label for="mjesto">Mjesto stanovanja:</label>
    <input type="text" id="mjesto" name="mjesto_stanovanja">

    <div id="spol">
        <label>
            <input type="radio" name="spol" value="muški">
            Muškarac
        </label>
        <label>
            <input type="radio" name="spol" value="ženski">
            Žena
        </label>
    </div>

    <button type="submit">Registracija</button>
    <p id="poruka"></p>
</form>

        <div id="login-container">
            <div class="link">
                <p><a href="/">Nastavi kao Guest</a></p>
            </div>
            <div class="link">
                <p><a href="/">Otiđi na log in</a></p>
            </div>
        </div>
    </div>
</body>
</html>

<script src="signup.js"></script>
</body>
