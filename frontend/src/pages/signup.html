<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoStay</title>

    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div id="reg-box">
        <h2 class="naslov">Napravi CoStay račun</h2>
        <h1 class="opis">Unesi svoje podatke za registraciju.</h1>
        
        <form id="form" action="/" method="POST">
            <div id="name">
                <label for="ime">Ime:</label>
                <input type="text" id="ime" name="ime" required>

                <label for="prezime">Prezime:</label>
                <input type="text" id="prezime" name="prezime" required>
            </div>

            <label for="email">Email:</label>
            <input type="text" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="birthday">Datum rođenja:</label>
            <input type="date" id="birthday" name="birthday">

            <div id="spol">
                <label>
                    <input type="radio" name="spol" value="man">
                    Muškarac
                </label>
                <label>
                    <input type="radio" name="spol" value="woman">
                    Žena
                </label>
            </div>

            <button type="submit">Registracija</button>
        </form>

        <div id="login-container">
            <div class="link">
                <p><a href="/">Nastavi kao Guest</a></p>
            </div>
            <div class="link">
                <p><a href="/">Otiđi na log in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
