
<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./inbox.css" />
    <link rel="stylesheet" href="./main.css" />

    <title>Inbox</title>
  </head>

  <body>
    <div class="zaglavlje"></div>

    <main class="inboxTijelo">
      <h1 class="inboxNaslov">Inbox</h1>

      <button class="buddyZahtjevi "id="buddyGumb" type="button" aria-expanded="false">
        <img src="../assets/users-round.svg" alt=" "class="buddySlika"/>
        <div class="buddyTekst">
          <h2>Buddy requests</h2>
          <p>3 pending buddy requests</p>
        </div>
        <span class="buddyStrelica" id="buddyStrelica">⌄</span>
      </button>

      <div class="zahtjeviLista" id="zahtjeviLista" hidden>
        <div class="zahtjev">
          <img src="../assets/probnaSlikaKartica.jpg" alt="" />
          <div class="osobaPodaci">
            <h3>Marko Horvat</h3>
            <p>Wants to be your buddy</p>
          </div>
          <button class="zahtjevGumb" type="button">Accept</button>
        </div>

        <div class="zahtjev">
          <img src="../assets/probnaSlikaKartica.jpg" alt="" />
          <div class="osobaPodaci">
            <h3>Ana Lovač</h3>
            <p>Wants to be your buddy</p>
          </div>
          <button class="zahtjevGumb" type="button">Accept</button>
        </div>

        <div class="zahtjev">
          <img src="../assets/probnaSlikaKartica.jpg" alt="" />
          <div class="osobaPodaci">
            <h3>Ivan Larić</h3>
            <p>Wants to be your buddy</p>
          </div>
          <button class="zahtjevGumb" type="button">Accept</button>
        </div>
      </div>

      <section class="porukeSekcija">
        <h2 class="porukeNaslov">Messages</h2>

        <div class="porukeLista">
          <a href="#" class="poruka">
            <img src="../assets/probnaSlikaKartica.jpg" alt="" class="osobaSlika"/>
            <div class="porukaTekst">
              <h3>John Pork</h3>
              <p>Answer the phone!!</p>
            </div>
            <span class="porukaVrijeme">10:24</span>
          </a>

          <a href="#" class="poruka">
            <img src="../assets/probnaSlikaKartica.jpg" alt="" class="osobaSlika"/>
            <div class="porukaTekst">
              <h3>John Pork</h3>
              <p>Hello!</p>
            </div>
            <span class="porukaVrijeme">10:24</span>
          </a>

          <a href="#" class="poruka">
            <img src="../assets/probnaSlikaKartica.jpg" alt="" class="osobaSlika"/>
            <div class="porukaTekst">
              <h3>John Pork</h3>
              <p>Asnwer!</p>
            </div>
            <span class="porukaVrijeme">10:24</span>
          </a>

          <a href="#" class="poruka">
            <img src="../assets/probnaSlikaKartica.jpg" alt="" class="osobaSlika"/>
            <div class="porukaTekst">
              <h3>John Pork</h3>
              <p>Answer the phone!</p>
            </div>
            <span class="porukaVrijeme">10:24</span>
          </a>

        </div>
      </section>
    </main>

    <div id="navbar"></div>

    <script src="../components/navbar.js"></script>

    <script>
      const buddyGumb = document.getElementById("buddyGumb");
      const zahtjeviLista = document.getElementById("zahtjeviLista");
      const buddyStrelica = document.getElementById("buddyStrelica");

      buddyGumb.addEventListener("click", function () {
        zahtjeviLista.hidden = !zahtjeviLista.hidden;

        buddyGumb.setAttribute(
          "aria-expanded",
          !zahtjeviLista.hidden
        );

        buddyStrelica.textContent = zahtjeviLista.hidden ? "⌄" : "⌃";
      });
    </script>
  </body>
</html>
